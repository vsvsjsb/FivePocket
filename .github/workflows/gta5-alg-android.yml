name: GTA5 ALG Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - gta5-alg-driver-support
    paths:
      - "editions/single-screen/android/**"
      - ".github/workflows/gta5-alg-android.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build standalone GTA5 ALG APK
        working-directory: editions/single-screen/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Verify APK package and upload
        run: |
          APK="editions/single-screen/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.vsvsjsb.gta5alg'"
          mkdir -p artifacts
          cp "$APK" artifacts/GTA5-ALG-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA5-ALG-debug-APK
          path: artifacts/GTA5-ALG-debug.apk
          if-no-files-found: error
          retention-days: 14
