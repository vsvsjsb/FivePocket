name: GTA5 ALG Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - gta5-alg-dev
    paths:
      - "android/**"
      - ".github/workflows/gta5-alg-android.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build standalone GTA5 ALG APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Verify APK package and upload
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.vsvsjsb.gta5alg'"
          mkdir -p artifacts
          cp "$APK" artifacts/GTA5-ALG-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA5-ALG-debug-APK
          path: artifacts/GTA5-ALG-debug.apk
          if-no-files-found: error
          retention-days: 14
